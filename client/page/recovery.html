<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta 
    name="viewport" 
    content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/global.css">

    <title>Recuperar</title>
</head>

<body>
    <main>
        <form>
            <h1>Recuperar</h1>

            <label>E-mail *</label>
            <input type="email" placeholder="Digite Seu E-mail"/>

            <label> Nova Senha *</label>
            <input id="new-password" type="password" placeholder="Digite Sua Senha" />
            
            <label> Confirmar Nova Senha *</label>
            <input id="confirm-new-password" type="password" placeholder="Confirme Sua Senha"/>

            <div class="show-password-wrapper">
                <input type="checkbox" />
                <label id="labelPassword" >Mostrar Senha</label>
            </div>

            <button>Recuperar</button>

            <p>Não possui cadastro? Registre-se <a href="./register.html">aqui</a>.</p>
        </form>
    </main>

    <script src="../scripts/recovery.js"></script>
</body>
</html>
