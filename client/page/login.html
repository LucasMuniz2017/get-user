<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/global.css">

    <title>Acessar</title>
</head>

<body>
    <main>
        <form>
            <h1>Acessar</h1>

            <label>E-mail *</label>
            <input type="email" placeholder="Digite Seu E-mail" />

            <label>Senha *</label>
            <input type="password" placeholder="Digite Sua Senha"/>

            <div class="show-password-wrapper">
                <input type="checkbox" />
                <label id="label-password">Mostrar Senha</label>
            </div>

            <button>Acessar</button>

            <p>Esqueceu a senha? Recupere-a <a href="./recovery.html">aqui</a>.</p>
            <p>Não possui cadastro? Registre-se <a href="./register.html">aqui</a>.</p>
        </form>
    </main>

    <script src="../scripts/login.js"></script>
</body>

</html>
